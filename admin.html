<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
  body { font-family: Arial; background: #f2f2f2; padding: 20px; }
  .container { max-width: 800px; margin: auto; background: white; padding: 24px; border-radius: 10px; }
  h2 { margin-top: 0; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #ddd; }
  .logout-btn { background: #e53935; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<script>
  // Auth Guard — login না থাকলে login page-এ পাঠাবে
  if (localStorage.getItem("isLoggedIn") !== "true" ||
      localStorage.getItem("userRole") !== "admin") {
    window.location.href = "/";
  }
</script>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2>Admin Panel</h2>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="info-row"><span>Username</span><span id="u">—</span></div>
  <div class="info-row"><span>Email</span><span id="e">—</span></div>
  <div class="info-row"><span>Role</span><span id="r">—</span></div>
  <div class="info-row"><span>Login Time</span><span id="t">—</span></div>
</div>

<script>
  document.getElementById("u").textContent = localStorage.getItem("username") || "—";
  document.getElementById("e").textContent = localStorage.getItem("userEmail") || "—";
  document.getElementById("r").textContent = localStorage.getItem("userRole") || "—";
  document.getElementById("t").textContent = localStorage.getItem("loginTime") || "—";

  document.getElementById("logoutBtn").onclick = function () {
    localStorage.clear();
    window.location.href = "/";
  };
</script>
</body>
</html>
